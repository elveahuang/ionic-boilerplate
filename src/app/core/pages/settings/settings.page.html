<ion-header>
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-back-button defaultHref="/tabs/me"></ion-back-button>
        </ion-buttons>
        <ion-title>系统设置</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
    <!-- 外观与主题设置 -->
    <ion-list-header class="text-xs font-semibold tracking-wider text-zinc-500 uppercase">外观显示</ion-list-header>
    <ion-list [inset]="true" class="m-0 mb-6 overflow-hidden rounded-xl shadow-sm">
        <ion-item>
            <ion-icon name="color-palette-outline" slot="start" color="primary"></ion-icon>
            <ion-label>
                <h2>主题模式</h2>
                <p>自定义应用外观与系统深浅色适配</p>
            </ion-label>
        </ion-item>
        <ion-item lines="none">
            <ion-segment [value]="themeService.theme()" (ionChange)="onThemeChange($event)" class="my-1">
                <ion-segment-button value="system">
                    <ion-label>跟随系统</ion-label>
                </ion-segment-button>
                <ion-segment-button value="light">
                    <ion-label>浅色模式</ion-label>
                </ion-segment-button>
                <ion-segment-button value="dark">
                    <ion-label>深色模式</ion-label>
                </ion-segment-button>
            </ion-segment>
        </ion-item>
    </ion-list>

    <!-- 缓存与存储 -->
    <ion-list-header class="text-xs font-semibold tracking-wider text-zinc-500 uppercase">存储与数据</ion-list-header>
    <ion-list [inset]="true" class="m-0 mb-6 overflow-hidden rounded-xl shadow-sm">
        <ion-item button (click)="clearCache()" detail="false">
            <ion-icon name="trash-outline" slot="start" color="warning"></ion-icon>
            <ion-label>清除本地缓存</ion-label>
            <ion-note slot="end">释放空间</ion-note>
        </ion-item>
    </ion-list>

    <!-- 关于与协议 -->
    <ion-list-header class="text-xs font-semibold tracking-wider text-zinc-500 uppercase">关于应用</ion-list-header>
    <ion-list [inset]="true" class="m-0 mb-6 overflow-hidden rounded-xl shadow-sm">
        <ion-item button routerLink="/about" detail="true">
            <ion-icon name="information-circle-outline" slot="start" color="medium"></ion-icon>
            <ion-label>关于 Ionic Boilerplate</ion-label>
            <ion-note slot="end">v26.1.0</ion-note>
        </ion-item>
    </ion-list>
</ion-content>
